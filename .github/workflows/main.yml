name: Main

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/workflows/setup
      - name: Lint
        run: pnpm run lint
      - name: Check formatting
        run: pnpm run format:check
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build and test
        run: pnpm test

  gate:
    name: Gate
    if: always()
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        run: test "$CHECK_RESULT" = success
